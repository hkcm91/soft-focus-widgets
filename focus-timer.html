<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.classList.add(t)})()</script><style>:root{--bg:#fff7fb;--card:#ffffff;--ink:#5b4a6b;--soft:#9a8aa8;--pink:#f7c6d9;--lav:#d9c8f5;--mint:#c8ebd9;--butter:#fbefc0;--sky:#c9e2f7;--accent:#c58fd6;--line:#f1e4ee}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#191919;--card:#252126;--ink:#f3e9f7;--soft:#b7a8c2;--line:#3a3340;--pink:#6b3f55;--lav:#4d3f6b;--mint:#2f5546;--butter:#5e5230;--sky:#2f4a63;--accent:#d7a8e6}}
:root.dark{--bg:#191919;--card:#252126;--ink:#f3e9f7;--soft:#b7a8c2;--line:#3a3340;--pink:#6b3f55;--lav:#4d3f6b;--mint:#2f5546;--butter:#5e5230;--sky:#2f4a63;--accent:#d7a8e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Quicksand',ui-rounded,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.card{width:100%;height:100%;max-width:520px;background:var(--card);border-radius:24px;border:1.5px solid var(--line);box-shadow:0 6px 24px rgba(197,143,214,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;position:relative}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
button{font-family:inherit;font-weight:700;color:var(--ink);background:var(--lav);border:none;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-1px);filter:brightness(1.04)}button:active{transform:scale(.97)}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.on{background:var(--pink)}
</style><title>Focus Timer · Soft Focus</title>
<style>
.ring{position:relative;width:min(56vw,170px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.bgc{stroke:var(--line)}.fg{stroke:url(#g);transition:stroke-dashoffset .5s linear}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mm{font-size:clamp(28px,10vw,40px);font-weight:700}
.st{font-size:12px;color:var(--soft);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.row button{padding:6px 12px;font-size:13px}
</style>
</head><body><div class="card">
  <div class="label">Focus bubble</div>
  <div class="ring">
    <svg viewBox="0 0 120 120"><defs><linearGradient id="g"><stop offset="0" stop-color="#c58fd6"/><stop offset="1" stop-color="#f2a6c5"/></linearGradient></defs>
    <circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg>
    <div class="read"><div class="mm" id="mm">25:00</div><div class="st" id="st">ready when you are</div></div>
  </div>
  <div class="row" id="presets"></div>
  <div class="row"><button id="go">▶ Start</button><button class="ghost" id="rs">↺ Reset</button></div>
</div>
<script>
const C=2*Math.PI*52,arc=document.getElementById("arc");arc.style.strokeDasharray=C;
const P=[[5,"🧺 5"],[15,"☕ 15"],[25,"⚡ 25"],[45,"🌊 45"]];let total=25*60,left=total,timer=null,end=0;
const pre=document.getElementById("presets");
P.forEach(([m,l])=>{const b=document.createElement("button");b.className="ghost";b.textContent=l;b.onclick=()=>{stop();total=left=m*60;draw();mark(b)};pre.appendChild(b);if(m==25)mark(b)});
function mark(b){[...pre.children].forEach(x=>x.classList.remove("on"));b.classList.add("on")}
function draw(){const m=Math.floor(left/60),s=left%60;document.getElementById("mm").textContent=m+":"+String(s).padStart(2,"0");arc.style.strokeDashoffset=C*(1-left/total)}
function chime(){try{const a=new AudioContext();[523,659,784].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(0,a.currentTime+i*.18);g.gain.linearRampToValueAtTime(.2,a.currentTime+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.18+1.2);o.connect(g).connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+1.3)})}catch(e){}}
function stop(){clearInterval(timer);timer=null;go.textContent="▶ Start"}
const go=document.getElementById("go"),st=document.getElementById("st");
go.onclick=()=>{if(timer){stop();st.textContent="paused — that's okay";return}
end=Date.now()+left*1000;go.textContent="❚❚ Pause";st.textContent="you've got this";
timer=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1000));draw();if(!left){stop();st.textContent="done! stretch & sip 🌸";chime()}},250)};
document.getElementById("rs").onclick=()=>{stop();left=total;st.textContent="ready when you are";draw()};draw();
</script>
</body></html>
