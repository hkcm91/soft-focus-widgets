<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.classList.add(t)})()</script><style>:root{--bg:#fff7fb;--card:#ffffff;--ink:#5b4a6b;--soft:#9a8aa8;--pink:#f7c6d9;--lav:#d9c8f5;--mint:#c8ebd9;--butter:#fbefc0;--sky:#c9e2f7;--accent:#c58fd6;--line:#f1e4ee}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#191919;--card:#252126;--ink:#f3e9f7;--soft:#b7a8c2;--line:#3a3340;--pink:#6b3f55;--lav:#4d3f6b;--mint:#2f5546;--butter:#5e5230;--sky:#2f4a63;--accent:#d7a8e6}}
:root.dark{--bg:#191919;--card:#252126;--ink:#f3e9f7;--soft:#b7a8c2;--line:#3a3340;--pink:#6b3f55;--lav:#4d3f6b;--mint:#2f5546;--butter:#5e5230;--sky:#2f4a63;--accent:#d7a8e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Quicksand',ui-rounded,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.card{width:100%;height:100%;max-width:520px;background:var(--card);border-radius:24px;border:1.5px solid var(--line);box-shadow:0 6px 24px rgba(197,143,214,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;position:relative}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
button{font-family:inherit;font-weight:700;color:var(--ink);background:var(--lav);border:none;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-1px);filter:brightness(1.04)}button:active{transform:scale(.97)}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.on{background:var(--pink)}
</style><title>Today · Soft Focus</title>
<style>
.big{font-size:clamp(22px,7vw,34px);font-weight:700;line-height:1.15}
.date{font-size:15px;color:var(--soft);font-weight:600}
.time{font-size:clamp(34px,12vw,56px);font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),#e79bbd);-webkit-background-clip:text;background-clip:text;color:transparent}
.note{font-size:13px;color:var(--soft);background:var(--butter);color:var(--ink);padding:6px 14px;border-radius:999px}
</style>
</head><body><div class="card">
  <div class="big" id="hi">Hello</div>
  <div class="time" id="t">--:--</div>
  <div class="date" id="d"></div>
  <div class="note" id="n"></div>
</div>
<script>
const notes=["Just the next tiny thing 🌸","Water first, then the world 💧","Done is better than perfect ✨","Rest is productive too ☁️","You're not behind 💛","One step counts 🌱","Be gentle with you today 🫧"];
function tick(){const n=new Date(),h=n.getHours();
const g=h<5?"Hey, night owl 🌙":h<12?"Good morning ☀️":h<17?"Good afternoon 🌤":h<21?"Good evening 🌷":"Wind down time 🌙";
const name=new URLSearchParams(location.search).get("name");
document.getElementById("hi").textContent=name?g.replace(/ (\S+)$/,", "+name+" $1"):g;
document.getElementById("t").textContent=n.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
document.getElementById("d").textContent=n.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
const day=Math.floor(n/864e5);document.getElementById("n").textContent=notes[day%notes.length];}
tick();setInterval(tick,1000);
</script>
</body></html>
